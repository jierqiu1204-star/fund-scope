name: Deploy

on:
  push:
    branches:
      - codex-strategy-lab
  workflow_dispatch:

concurrency:
  group: deploy-codex-strategy-lab
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: ${{ vars.VPS_COMPOSE_FILE || 'docker-compose.yml' }}

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, fundscope-vps]
    timeout-minutes: 30
    steps:
      - name: Download pushed source archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu

          archive="$RUNNER_TEMP/fundscope-source.tar.gz"
          source_dir="$RUNNER_TEMP/fundscope-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir" "$GITHUB_WORKSPACE"

          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$archive"
          tar -xzf "$archive" -C "$source_dir" --strip-components=1
          rsync -a --delete "$source_dir"/ "$GITHUB_WORKSPACE"/

      - name: Deploy on VPS
        run: |
          set -eu

          case "$COMPOSE_FILE" in
            docker-compose.yml|docker-compose.ip.yml) ;;
            *)
              echo "Unsupported VPS_COMPOSE_FILE: $COMPOSE_FILE" >&2
              exit 1
              ;;
          esac

          deploy_dir=/srv/fundscope
          case "$deploy_dir" in
            /srv/fundscope) ;;
            *)
              echo "Refusing to deploy to unexpected path: $deploy_dir" >&2
              exit 1
              ;;
          esac

          mkdir -p "$deploy_dir"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'deploy/.env' \
            --exclude 'deploy/.htpasswd' \
            "$GITHUB_WORKSPACE"/ "$deploy_dir"/
          echo "$GITHUB_SHA" > "$deploy_dir/.deploy-version"

          cd "$deploy_dir/deploy"
          sudo docker compose -f "$COMPOSE_FILE" down --remove-orphans
          sudo docker compose -f "$COMPOSE_FILE" rm -f -s frontend-static-builder 2>/dev/null || true
          sudo docker rm -f deploy-frontend-static-builder-1 2>/dev/null || true
          sudo docker compose -f "$COMPOSE_FILE" build backend frontend-static-builder
          sudo docker compose -f "$COMPOSE_FILE" run --rm frontend-static-builder
          sudo docker compose -f "$COMPOSE_FILE" up -d postgres backend
          sudo docker compose -f "$COMPOSE_FILE" up -d --no-deps nginx
          sudo docker compose -f "$COMPOSE_FILE" exec -T backend alembic upgrade head
          sudo docker image prune -f
          sudo docker compose -f "$COMPOSE_FILE" ps
