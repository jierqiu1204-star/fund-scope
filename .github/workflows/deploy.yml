name: Deploy

on:
  push:
    branches:
      - codex-strategy-lab
  workflow_dispatch:

concurrency:
  group: deploy-codex-strategy-lab
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: ${{ vars.VPS_COMPOSE_FILE || 'docker-compose.yml' }}
  BACKUP_KEEP_COUNT: ${{ vars.VPS_BACKUP_KEEP_COUNT || '2' }}
  BACKUP_RETENTION_DAYS: ${{ vars.VPS_BACKUP_RETENTION_DAYS || '7' }}
  BACKUP_STALE_TMP_MINUTES: ${{ vars.VPS_BACKUP_STALE_TMP_MINUTES || '360' }}
  BACKUP_MIN_FREE_BYTES: ${{ vars.VPS_BACKUP_MIN_FREE_BYTES || '2147483648' }}
  BACKUP_ESTIMATED_BYTES: ${{ vars.VPS_BACKUP_ESTIMATED_BYTES || '5368709120' }}
  BACKUP_COMPRESSION: ${{ vars.VPS_BACKUP_COMPRESSION || 'zstd:1' }}

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, fundscope-vps]
    timeout-minutes: 30
    steps:
      - name: Prepare pushed source
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_tmp=$(mktemp -d "${RUNNER_TEMP:?}/fundscope-source.XXXXXX")
          trap 'rm -rf "$source_tmp"' EXIT
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 300 --retry 2 --retry-max-time 30 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            --output "$source_tmp/source.tar.gz"
          tar -tzf "$source_tmp/source.tar.gz" > /dev/null
          mkdir "$source_tmp/source"
          tar -xzf "$source_tmp/source.tar.gz" --strip-components=1 \
            -C "$source_tmp/source"
          test -f "$source_tmp/source/backend/Dockerfile"
          test -f "$source_tmp/source/frontend/package.json"
          test -f "$source_tmp/source/deploy/backup-compose.sh"
          mkdir -p "${GITHUB_WORKSPACE:?}"
          rsync -a --delete "$source_tmp/source/" "$GITHUB_WORKSPACE/"
          printf 'Prepared source archive for %s\n' "$GITHUB_SHA"

      - name: Deploy on VPS
        run: |
          set -euo pipefail

          case "$COMPOSE_FILE" in
            docker-compose.yml|docker-compose.ip.yml) ;;
            *)
              echo "Unsupported VPS_COMPOSE_FILE: $COMPOSE_FILE" >&2
              exit 1
              ;;
          esac

          deploy_dir=/srv/fundscope
          case "$deploy_dir" in
            /srv/fundscope) ;;
            *)
              echo "Refusing to deploy to unexpected path: $deploy_dir" >&2
              exit 1
              ;;
          esac

          frontend_changed=true
          if [ -d "$deploy_dir/frontend" ] && diff -qr \
            --exclude .next \
            --exclude node_modules \
            --exclude out \
            "$GITHUB_WORKSPACE/frontend" "$deploy_dir/frontend" > /dev/null; then
            frontend_changed=false
          fi
          printf 'frontend_changed=%s\n' "$frontend_changed"

          mkdir -p "$deploy_dir"
          candidate_image="fundscope-backend-candidate:$GITHUB_SHA"
          trap 'sudo docker image rm "$candidate_image" >/dev/null 2>&1 || true' EXIT
          if command -v apt-get > /dev/null 2>&1; then
            if [ -d /var/cache/apt/archives ]; then
              sudo du -sh /var/cache/apt/archives >&2
            fi
            sudo apt-get clean
          fi
          for old_image in $(sudo docker image ls --filter 'reference=fundscope-*' \
            --format '{{.Repository}}:{{.Tag}}'); do
            container_refs=$(sudo docker ps -aq --filter "ancestor=$old_image")
            if [ -n "$container_refs" ]; then
              printf 'Keeping FundScope image referenced by a container: %s\n' "$old_image" >&2
              continue
            fi
            sudo docker image rm "$old_image" || true
          done
          if [ "$frontend_changed" = true ]; then
            frontend_builder_image=deploy-frontend-static-builder:latest
            builder_refs=$(sudo docker ps -aq --filter "ancestor=$frontend_builder_image")
            if [ -z "$builder_refs" ]; then
              sudo docker image rm "$frontend_builder_image" || true
            fi
          fi
          sudo docker image prune -f
          sudo docker builder prune -af
          sudo docker build --tag "$candidate_image" "$GITHUB_WORKSPACE/backend"
          candidate_heads=$(
            sudo docker run --rm --entrypoint alembic "$candidate_image" heads
          )
          candidate_head_count=$(
            printf '%s\n' "$candidate_heads" | awk '/\(head\)/ { count += 1 } END { print count + 0 }'
          )
          test "$candidate_head_count" -eq 1
          candidate_schema_head=$(
            printf '%s\n' "$candidate_heads" | awk '/\(head\)/ { print $1; exit }'
          )
          test -n "$candidate_schema_head"
          sudo docker image rm "$candidate_image" || true
          sudo docker image prune -f
          sudo docker builder prune -af

          backup_dir=/var/backups/fundscope
          sudo mkdir -p "$backup_dir"
          rollback_metadata="$backup_dir/rollback-metadata-$(date +%Y%m%d_%H%M%S).txt"
          test -f "$deploy_dir/deploy/$COMPOSE_FILE"
          previous_deploy_sha=$(
            if [ -f "$deploy_dir/.deploy-version" ]; then
              cat "$deploy_dir/.deploy-version"
            else
              printf '%s' unrecorded
            fi
          )
          cd "$deploy_dir/deploy"
          fqdn=
          if [ "$COMPOSE_FILE" = docker-compose.yml ]; then
            test -f "$deploy_dir/deploy/.env"
            fqdn=$(sed -n 's/^FQDN=//p' "$deploy_dir/deploy/.env" | tail -n 1)
            case "$fqdn" in
              ""|.*|*.|*[!A-Za-z0-9.-]*)
                echo "Missing or invalid FQDN in deploy/.env" >&2
                exit 1
                ;;
            esac
            timeout 55 sudo docker compose -f "$COMPOSE_FILE" run --rm --no-deps \
              --entrypoint sh certbot -c \
              "test -s /etc/letsencrypt/live/$fqdn/fullchain.pem && test -s /etc/letsencrypt/live/$fqdn/privkey.pem"
          fi

          sudo docker compose -f "$COMPOSE_FILE" up -d postgres
          postgres_ready=false
          for attempt in $(seq 1 20); do
            if sudo docker compose -f "$COMPOSE_FILE" exec -T postgres \
              pg_isready -U fundscope -d fundscope; then
              postgres_ready=true
              break
            fi
            sleep 2
          done
          test "$postgres_ready" = true
          previous_revision_count=$(
            sudo docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -U fundscope -d fundscope -Atqc \
              "SELECT count(*) FROM alembic_version"
          )
          test "$previous_revision_count" -eq 1
          previous_schema_head=$(
            sudo docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -U fundscope -d fundscope -Atqc \
              "SELECT version_num FROM alembic_version"
          )
          test -n "$previous_schema_head"
          {
            df -Pk "$backup_dir"
            sudo du -sh "$backup_dir"
            sudo find "$backup_dir" -maxdepth 1 -type f -name 'fundscope_*.dump' \
              -printf 'Backup %f: %s bytes\n'
            sudo docker system df
            sudo docker image ls \
              --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
            sudo docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            printf 'PostgreSQL database size (bytes): '
            sudo docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -U fundscope -d fundscope -Atqc \
              "SELECT pg_database_size(current_database())"
            sudo docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -U fundscope -d fundscope -P pager=off -c \
              "SELECT schemaname, relname,
                pg_total_relation_size(relid) AS total_bytes,
                pg_relation_size(relid) AS heap_bytes,
                pg_table_size(relid) AS table_bytes,
                pg_indexes_size(relid) AS index_bytes,
                n_live_tup, n_dead_tup
              FROM pg_stat_user_tables ORDER BY total_bytes DESC"
          } >&2
          backup_path=$(
            sudo env \
              BACKUP_DIR="$backup_dir" \
              COMPOSE_FILE="$COMPOSE_FILE" \
              BACKUP_KEEP_COUNT="$BACKUP_KEEP_COUNT" \
              BACKUP_RETENTION_DAYS="$BACKUP_RETENTION_DAYS" \
              BACKUP_STALE_TMP_MINUTES="$BACKUP_STALE_TMP_MINUTES" \
              BACKUP_MIN_FREE_BYTES="$BACKUP_MIN_FREE_BYTES" \
              BACKUP_ESTIMATED_BYTES="$BACKUP_ESTIMATED_BYTES" \
              BACKUP_COMPRESSION="$BACKUP_COMPRESSION" \
              sh "$GITHUB_WORKSPACE/deploy/backup-compose.sh"
          )
          sudo test -s "$backup_path"
          sudo sha256sum -c "$backup_path.sha256"

          printf '%s\n' \
            "previous_deploy_sha=$previous_deploy_sha" \
            "previous_schema_head=$previous_schema_head" \
            "database_backup=$backup_path" \
            "candidate_schema_head=$candidate_schema_head" \
            "candidate_deploy_sha=$GITHUB_SHA" \
            | sudo tee "$rollback_metadata" > /dev/null

          cd "$GITHUB_WORKSPACE"
          sudo rsync -a --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.deploy-version' \
            --exclude 'deploy/.env' \
            --exclude 'deploy/.htpasswd' \
            "$GITHUB_WORKSPACE"/ "$deploy_dir"/

          cd "$deploy_dir/deploy"
          sudo docker compose -f "$COMPOSE_FILE" build backend
          if [ "$frontend_changed" = true ]; then
            sudo docker compose -f "$COMPOSE_FILE" build frontend-static-builder
          fi

          sudo docker compose -f "$COMPOSE_FILE" down --remove-orphans
          if [ "$frontend_changed" = true ]; then
            sudo docker compose -f "$COMPOSE_FILE" rm -f -s frontend-static-builder 2>/dev/null || true
            sudo docker rm -f deploy-frontend-static-builder-1 2>/dev/null || true
            sudo docker compose -f "$COMPOSE_FILE" run --rm frontend-static-builder
          fi
          sudo docker compose -f "$COMPOSE_FILE" up -d postgres
          postgres_ready=false
          for attempt in $(seq 1 20); do
            if sudo docker compose -f "$COMPOSE_FILE" exec -T postgres \
              pg_isready -U fundscope -d fundscope; then
              postgres_ready=true
              break
            fi
            sleep 2
          done
          test "$postgres_ready" = true
          sudo docker compose -f "$COMPOSE_FILE" run --rm --no-deps backend alembic upgrade head
          deployed_revision_count=$(
            sudo docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -U fundscope -d fundscope -Atqc \
              "SELECT count(*) FROM alembic_version"
          )
          test "$deployed_revision_count" -eq 1
          deployed_schema_head=$(
            sudo docker compose -f "$COMPOSE_FILE" exec -T postgres \
              psql -U fundscope -d fundscope -Atqc \
              "SELECT version_num FROM alembic_version"
          )
          test "$deployed_schema_head" = "$candidate_schema_head"
          sudo docker compose -f "$COMPOSE_FILE" up -d backend
          sudo docker compose -f "$COMPOSE_FILE" up -d --no-deps nginx
          health_payload=$(
            COMPOSE_FILE="$COMPOSE_FILE" FQDN="$fqdn" timeout 60 sh -c '
              for attempt in $(seq 1 10); do
                if [ "$COMPOSE_FILE" = docker-compose.yml ]; then
                  payload=$(curl --fail --silent --show-error \
                    --connect-timeout 3 --max-time 5 \
                    --resolve "$FQDN:443:127.0.0.1" \
                    "https://$FQDN/api/health") || payload=
                else
                  payload=$(curl --fail --silent --show-error \
                    --connect-timeout 3 --max-time 5 \
                    http://127.0.0.1/api/health) || payload=
                fi
                if [ -n "$payload" ]; then
                  printf "%s" "$payload"
                  exit 0
                fi
                sleep 4
              done
              exit 1
            '
          )
          printf '%s\n' "$health_payload" | grep -Eq '"app"[[:space:]]*:[[:space:]]*"ok"'
          printf '%s\n' "$health_payload" | grep -Eq '"db"[[:space:]]*:[[:space:]]*"ok"'
          echo "$GITHUB_SHA" > "$deploy_dir/.deploy-version"
          printf '%s\n' \
            "deployed_schema_head=$deployed_schema_head" \
            "health=ok" \
            | sudo tee -a "$rollback_metadata" > /dev/null
          {
            echo "Database backup: $backup_path"
            echo "Rollback metadata: $rollback_metadata"
            echo "Previous deploy: $previous_deploy_sha ($previous_schema_head)"
            echo "Deployed: $GITHUB_SHA ($deployed_schema_head)"
          } >> "$GITHUB_STEP_SUMMARY"
          sudo docker image rm "$candidate_image" 2>/dev/null || true
          sudo docker image prune -f
          sudo docker builder prune -af
          sudo docker compose -f "$COMPOSE_FILE" ps
