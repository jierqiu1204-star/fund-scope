services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fundscope
      POSTGRES_USER: fundscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env before running compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    env_file:
      - ./etf-research.env
      - ../.env
    volumes:
      - research-artifacts:/app/data
    depends_on:
      - postgres
    restart: unless-stopped

  frontend-static-builder:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    command: sh -c "rm -rf /exported/* && cp -R /app/out/. /exported/"
    volumes:
      - frontend-static:/exported

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend-static-builder
    ports:
      - "80:80"
    volumes:
      - ./nginx-ip-http.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-static:/usr/share/nginx/html:ro
      - certbot-var:/var/www/certbot:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot

volumes:
  postgres-data:
  frontend-static:
  research-artifacts:
  certbot-etc:
  certbot-var:
