services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fundscope
      POSTGRES_USER: fundscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fundscope}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    env_file:
      - ./etf-research.env
      - ../.env
    volumes:
      - research-artifacts:/app/data
    depends_on:
      - postgres
    restart: unless-stopped

  frontend-static-builder:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_ETF_LEADER_TACTICS_V2_ENABLED: ${NEXT_PUBLIC_ETF_LEADER_TACTICS_V2_ENABLED:-false}
        NEXT_PUBLIC_LATE_DAY_TURNAROUND_ENABLED: ${NEXT_PUBLIC_LATE_DAY_TURNAROUND_ENABLED:-false}
    command: sh -c "rm -rf /exported/* && cp -R /app/out/. /exported/"
    volumes:
      - frontend-static:/exported

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend-static-builder
    environment:
      FQDN: ${FQDN}
    ports:
      - "80:80"
      - "443:443"
    command: >
      /bin/sh -c "envsubst '$$FQDN' < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - frontend-static:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot

volumes:
  postgres-data:
  frontend-static:
  research-artifacts:
  certbot-etc:
  certbot-var:
